[package]
name = "niri-appbeam"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Run-or-raise for the niri Wayland compositor: launch an app, focus it, or jump back"
readme = "README.md"
repository = "https://github.com/FluxCode101/niri-appbeam"
keywords = ["niri", "wayland", "run-or-raise", "launcher", "compositor"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
niri-ipc = "26.4.0"
regex = "1.13.1"

[dev-dependencies]
serde_json = "1.0.151"

[profile.release]
lto = true
strip = true
codegen-units = 1
